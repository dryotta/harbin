[project]
name = "harbin"
description = "A minimalist command center for GitHub Copilot AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dynamic = ["version"]
authors = [{ name = "David Zhao" }]
keywords = ["agents", "copilot", "tui", "textual", "fleet", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "textual>=0.80",
  "textual-serve>=1.0",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pydantic>=2.7",
  "watchdog>=4",
  "croniter>=2",
  "platformdirs>=4",
  "pyyaml>=6",
]

[project.scripts]
harbin = "harbin.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-textual-snapshot>=1",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-croniter",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+dev"

[tool.hatch.build.targets.wheel]
packages = ["src/harbin"]

[tool.hatch.build.targets.sdist]
include = ["src/harbin", "README.md", "LICENSE", "doc"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["scripts", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = [
  "B008",
  "RUF012",
  "ASYNC109",
  "ASYNC240",
  "RUF001",
  "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "F841", "RUF059", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/harbin"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["harbin.tui.*", "harbin.web.*", "harbin.repl.commands.config"]
disallow_subclassing_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
disallow_any_generics = false
check_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning:harbin.*",
]
